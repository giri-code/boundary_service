version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: minio_s3
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped

  createbuckets:
    image: minio/mc:latest
    container_name: minio_create_buckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'Waiting for MinIO...'; sleep 1; done;
      /usr/bin/mc mb local/photos --ignore-existing;
      /usr/bin/mc anonymous set download local/photos;
      exit 0;
      "

  boundary_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boundary_service_app
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - STORAGE_BACKEND=s3
      - S3_BUCKET=photos
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - LOCAL_STORAGE_ROOT=/app/storage
      - SEGMENTATION_MODEL_PROVIDER=mobile_sam
      - WEB_CONCURRENCY=1
      - ENABLE_EMBEDDING_CACHE=True
      - REDIS_URL=redis://host.docker.internal:6379
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
    restart: unless-stopped
    depends_on:
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  minio_data:

