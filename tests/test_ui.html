<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boundary Detection Tester</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 2rem;
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            margin: 0.5rem 0 0 0;
            color: var(--text-secondary);
        }

        .container {
            display: flex;
            flex: 1;
            padding: 2rem;
            gap: 2rem;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }

        .left-panel {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .right-panel {
            flex: 1;
            overflow-y: auto;
            max-height: calc(100vh - 150px);
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .file-upload {
            position: relative;
            display: inline-block;
        }

        .file-upload input[type="file"] {
            display: none;
        }

        .btn {
            background: var(--accent-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
        }

        .select-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .select-wrapper select, .select-wrapper input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            color: white;
            padding: 0.5rem;
            border-radius: 0.25rem;
            font-family: 'Inter', sans-serif;
            outline: none;
        }
        
        .select-wrapper input {
            width: 80px;
        }

        .canvas-container {
            position: relative;
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 0.5rem;
            border: 1px dashed var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            min-height: 400px;
        }

        .canvas-container.empty::after {
            content: "Upload an image to start";
            color: var(--text-secondary);
            font-size: 1.2rem;
            position: absolute;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            cursor: crosshair;
            transition: transform 0.2s ease;
        }

        .response-box {
            background: #000;
            border-radius: 0.5rem;
            padding: 1rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            color: #a78bfa;
            overflow-x: auto;
            white-space: pre-wrap;
            border: 1px solid var(--border-color);
        }

        .status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 0.5rem;
            display: none;
            font-weight: 500;
        }

        .status.loading {
            display: block;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            animation: pulse 2s infinite;
        }

        .status.success {
            display: block;
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status.error {
            display: block;
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }
        
        .metric {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Boundary Detection UI</h1>
        <p>Upload an image and click on an object to detect its precise boundary.</p>
    </header>

    <div class="container">
        <!-- Left Panel: Controls and Image -->
        <div class="panel left-panel">
            <div class="controls">
                <div class="file-upload">
                    <label class="btn" for="imageInput">
                        📸 Choose Image
                    </label>
                    <input type="file" id="imageInput" accept="image/png, image/jpeg, image/jpg">
                </div>
                
                <span id="fileName" style="color: var(--text-secondary); font-size: 0.9rem;">No file chosen</span>

                <div class="select-wrapper" style="margin-left: auto;">
                    <label for="modelSelect">Model:</label>
                    <select id="modelSelect">
                        <option value="mobile_sam" selected>MobileSAM</option>
                        <option value="opencv">OpenCV (Local)</option>
                    </select>
                </div>

                <div class="select-wrapper">
                    <label for="levelSelect">Granularity:</label>
                    <select id="levelSelect">
                        <option value="0" selected>Fine (Face/Watch)</option>
                        <option value="1">Medium (Torso/Part)</option>
                        <option value="2">Coarse (Whole Object)</option>
                        <option value="">Auto (Highest Confidence)</option>
                    </select>
                </div>
                
                <div class="select-wrapper">
                    <label for="toleranceInput">Tolerance:</label>
                    <input type="number" id="toleranceInput" value="0.005" step="0.001" min="0.001" max="0.1">
                </div>
            </div>

            <div class="canvas-container empty" id="canvasContainer">
                <canvas id="imageCanvas"></canvas>
            </div>
            
            <p style="color: var(--text-secondary); font-size: 0.85rem; margin: 0; text-align: center;">
                Click anywhere on the image to select an object.
            </p>
        </div>

        <!-- Right Panel: Results -->
        <div class="panel right-panel">
            <h2>Detection Results</h2>
            
            <div id="statusBox" class="status">Waiting for input...</div>
            
            <div id="metricsBox" style="margin: 1rem 0; display: none;">
                <span class="metric" id="metricTime">⏱ Time: -</span>
                <span class="metric" id="metricConf">🎯 Confidence: -</span>
                <span class="metric" id="metricArea">📐 Area: -</span>
            </div>

            <div class="response-box" id="jsonResponse">
// API Response will appear here...
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000/api/v1/boundary/upload";
        
        const imageInput = document.getElementById('imageInput');
        const fileNameDisplay = document.getElementById('fileName');
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        const canvasContainer = document.getElementById('canvasContainer');
        const statusBox = document.getElementById('statusBox');
        const jsonResponse = document.getElementById('jsonResponse');
        const modelSelect = document.getElementById('modelSelect');
        const levelSelect = document.getElementById('levelSelect');
        const toleranceInput = document.getElementById('toleranceInput');
        const metricsBox = document.getElementById('metricsBox');
        
        let currentImage = null;
        let originalFile = null;

        // Handle File Upload
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            originalFile = file;
            fileNameDisplay.textContent = file.name;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    currentImage = img;
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    canvasContainer.classList.remove('empty');
                    
                    // Reset UI
                    statusBox.className = 'status';
                    statusBox.textContent = 'Image loaded. Click an object to segment.';
                    statusBox.style.display = 'block';
                    jsonResponse.textContent = '// API Response will appear here...';
                    metricsBox.style.display = 'none';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Handle Canvas Click
        canvas.addEventListener('click', async (e) => {
            if (!currentImage || !originalFile) return;

            // Calculate exact pixel coordinates based on canvas scaling
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const x = Math.round((e.clientX - rect.left) * scaleX);
            const y = Math.round((e.clientY - rect.top) * scaleY);

            // Draw a temporary marker
            redrawImage();
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, 2 * Math.PI);
            ctx.fillStyle = '#ef4444';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'white';
            ctx.stroke();

            await detectBoundary(x, y);
        });

        function redrawImage() {
            if (currentImage) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(currentImage, 0, 0);
            }
        }

        async function detectBoundary(x, y) {
            statusBox.className = 'status loading';
            statusBox.textContent = `Processing click at (${x}, ${y})...`;
            
            const formData = new FormData();
            formData.append("file", originalFile);
            formData.append("x", x);
            formData.append("y", y);
            formData.append("tolerance", toleranceInput.value);
            formData.append("model_provider", modelSelect.value);
            
            if (levelSelect.value !== "") {
                formData.append("level", levelSelect.value);
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                // Format JSON nicely
                jsonResponse.textContent = JSON.stringify(data, null, 2);

                if (response.ok && data.success) {
                    statusBox.className = 'status success';
                    statusBox.textContent = 'Segmentation successful!';
                    
                    // Update metrics
                    document.getElementById('metricTime').textContent = `⏱ Time: ${data.processing_time_ms}ms`;
                    document.getElementById('metricConf').textContent = `🎯 Confidence: ${(data.confidence_score * 100).toFixed(1)}%`;
                    document.getElementById('metricArea').textContent = `📐 Area: ${data.area_pixels} px²`;
                    metricsBox.style.display = 'block';

                    drawPolygons(data.outer_boundary, data.holes);
                } else {
                    statusBox.className = 'status error';
                    statusBox.textContent = data.error || data.detail || 'Segmentation failed';
                }
            } catch (error) {
                statusBox.className = 'status error';
                statusBox.textContent = `Network Error: ${error.message}`;
                jsonResponse.textContent = '// Failed to connect to backend.';
            }
        }

        function drawPolygons(outer, holes) {
            redrawImage();
            
            if (!outer || outer.length === 0) return;

            // Set smooth line properties
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            
            // Add a glowing drop shadow
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            ctx.shadowBlur = 12;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 4;

            // Draw outer boundary (Glowing Cyan)
            ctx.beginPath();
            ctx.moveTo(outer[0].x, outer[0].y);
            for (let i = 1; i < outer.length; i++) {
                ctx.lineTo(outer[i].x, outer[i].y);
            }
            ctx.closePath();
            
            // Only draw the border, no fill!
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#06b6d4'; // Bright Cyan
            ctx.stroke();

            // Reset shadow before drawing holes to prevent double-shadowing if overlapping
            ctx.shadowColor = 'transparent';

            // Draw inner holes (Red outline)
            if (holes && holes.length > 0) {
                holes.forEach(hole => {
                    if (hole.length > 0) {
                        ctx.beginPath();
                        ctx.moveTo(hole[0].x, hole[0].y);
                        for (let i = 1; i < hole.length; i++) {
                            ctx.lineTo(hole[i].x, hole[i].y);
                        }
                        ctx.closePath();
                        
                        ctx.lineWidth = 2;
                        ctx.strokeStyle = '#ef4444'; // Red
                        ctx.stroke();
                    }
                });
            }
        }
    </script>
</body>
</html>
